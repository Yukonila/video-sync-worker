<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 14px;
            font-family: system-ui, sans-serif;
        }

        h3 {
            margin: 0 0 10px;
            font-size: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #555;
            margin-top: 10px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
            padding: 6px;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .primary {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .status {
            font-size: 12px;
            margin-top: 12px;
            color: #666;
        }
    </style>
</head>

<body>
    <h3>Video Sync</h3>

    <label>服务器地址（留空使用默认）</label>
    <input id="server" placeholder="默认公共服务器">

    <label>房间号</label>
    <input id="room" placeholder="输入房间号">
    <button id="generate">生成随机房间号</button>

    <button id="save" class="primary">连接</button>

    <div class="status" id="status">未连接</div>

    <script src="popup.js"></script>
</body>

</html>
